server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: settl-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settl?options=-c%20timezone=UTC}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:30000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000}
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:60000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:30000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: ${HIBERNATE_BATCH_SIZE:25}
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        default_batch_fetch_size: ${HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:50}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:c2V0dGwtZGV2ZWxvcG1lbnQtYW5kLXRlc3Qtand0LXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWZvci1obWFjLXNoYS0yNTY=}
    refresh-secret: ${JWT_REFRESH_SECRET:c2V0dGwtZGV2ZWxvcG1lbnQtYW5kLXRlc3QtcmVmcmVzaC1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  fx:
    base-url: ${FX_API_BASE_URL:https://api.frankfurter.dev}
  cors:
    allowed-origins: ${APP_BASE_URL:http://localhost:5173}
  secure-cookies: ${SECURE_COOKIES:false}
  rate-limit:
    login:
      limit: ${RATE_LIMIT_LOGIN:5}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}
    login-email:
      limit: ${RATE_LIMIT_LOGIN_EMAIL:5}
      window-seconds: ${RATE_LIMIT_LOGIN_EMAIL_WINDOW:60}
    resend-verification:
      limit: ${RATE_LIMIT_RESEND:3}
      window-seconds: ${RATE_LIMIT_RESEND_WINDOW:3600}
    invite:
      limit: ${RATE_LIMIT_INVITE:20}
      window-seconds: ${RATE_LIMIT_INVITE_WINDOW:3600}
    register:
      limit: ${RATE_LIMIT_REGISTER:3}
      window-seconds: ${RATE_LIMIT_REGISTER_WINDOW:3600}
    delete-account:
      limit: ${RATE_LIMIT_DELETE_ACCOUNT:3}
      window-seconds: ${RATE_LIMIT_DELETE_ACCOUNT_WINDOW:900}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha


