spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
  cors:
    allowed-origins: ${APP_BASE_URL}

logging:
  level:
    root: INFO
    com.settl.backend: INFO
    org.springframework.security: WARN
