spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/settl_test?options=-c%20timezone=UTC}
    username: ${TEST_DB_USER:postgres}
    password: ${TEST_DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:60000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:30000}
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: ${HIBERNATE_BATCH_SIZE:25}
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        default_batch_fetch_size: ${HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:50}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: c2V0dGwtZGV2ZWxvcG1lbnQtYW5kLXRlc3Qtand0LXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWZvci1obWFjLXNoYS0yNTY=
    refresh-secret: c2V0dGwtZGV2ZWxvcG1lbnQtYW5kLXRlc3QtcmVmcmVzaC1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  secure-cookies: ${SECURE_COOKIES:false}
  token-cleanup:
    cron: ${TOKEN_CLEANUP_CRON:0 0 3 * * *}
  rate-limit:
    login:
      limit: ${RATE_LIMIT_LOGIN:5}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}
    login-email:
      limit: ${RATE_LIMIT_LOGIN_EMAIL:5}
      window-seconds: ${RATE_LIMIT_LOGIN_EMAIL_WINDOW:60}
    resend-verification:
      limit: ${RATE_LIMIT_RESEND:3}
      window-seconds: ${RATE_LIMIT_RESEND_WINDOW:3600}
    invite:
      limit: ${RATE_LIMIT_INVITE:20}
      window-seconds: ${RATE_LIMIT_INVITE_WINDOW:3600}
    register:
      limit: ${RATE_LIMIT_REGISTER:3}
      window-seconds: ${RATE_LIMIT_REGISTER_WINDOW:3600}
    delete-account:
      limit: ${RATE_LIMIT_DELETE_ACCOUNT:3}
      window-seconds: ${RATE_LIMIT_DELETE_ACCOUNT_WINDOW:900}

 