version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: settl-postgres
    environment:
      POSTGRES_DB: expense_splitter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: settl-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
